<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
    function drawImage() {
        let sel = document.querySelector("#fruits");
        let img = document.querySelector("#fruitImage");
        img.src = sel.options[sel.selectedIndex].value;
    }
</script>
<body onload="drawImage()">
<h3>select객체에서 선택한 과일 출력</h3>
<hr>
과일을 선택하면 이미지가 출력됩니다.<p>
<form>
    <select id="fruits" onchange="drawImage()">
        <option value="media/strawberry.png">딸기
        <option value="media/banana.png" selected>바나나
        <option value="media/apple.png">사과
    </select>
    <img id="fruitImage" src="media/banana.png">
</form>
</body>
</html>
