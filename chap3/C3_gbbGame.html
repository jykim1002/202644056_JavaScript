<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body, h1, img {
            text-align: center;
        }
        img { display: inline-block;
            margin: 15px; 
            border: 1px solid black;
            width: 200px;
            height: 200px;}
    </style>
</head>
<body>
    <script>
        document.write("<h1>컴퓨터와 가위, 바위, 보 맞추기</h1>");
        document.write("<pre><h1> 컴퓨터         나 </h1></pre>");
        let game = prompt("가위, 바위, 보 중 입력", "");
        
        // 취소버튼을 누른경우
        if(game == null) {
            document.write("<h1> 취소 되었습니다. </h1>");
            throw new Error("취소 되었습니다.");
        }
        let gameNum;
        switch(game) {
            case "가위": gameNum =1;
                break;
            case "바위": gameNum =2;
                break;
            case "보": gameNum =3;
                break;
            default: alert("잘못 입력하셨습니다. ");
                location.reload()   // 현 프로그램 다시 실행
        }

        let comNum = Math.ceil(Math.random() * 3);
        document.write(`<img src='media/img${comNum}.png'>`);
        document.write(`<img src='media/img${gameNum}.png'>`);
        if(gameNum == comNum) {
            document.write("<h1> 비겼습니다. </h1>");
        } else {
            if ((gameNum == 1 && comNum == 2) || (gameNum == 2 && comNum == 3)
            || (gameNum == 3 && comNum == 1)) { document.write("<h1>컴퓨터가 이겼습니다.");
            }
            else {
                document.write("<h1>내가 이겼습니다.");
            }
        }
    </script>
</body>
</html>
