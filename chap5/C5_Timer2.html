<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
    let count = 0;
    let id = setInterval( () => {
        document.write(`<h3> 1초마다 실행됩니다. (${count+1}번쨰) </h3>`);
        count++}, 1*1000)

    setTimeout( () => {
        document.write('<h3>타이머를 중료합니다. </h3>')
        clearInterval(id)}, 5 * 1000)
</script>
<body>
    
</body>
</html>
