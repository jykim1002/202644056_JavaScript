<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let array = ['사과', '배', '귤', '바나나'];
        array.forEach((item, i) => {
            document.write(`<h3>${i+1}번째 요소: ${item}</h3>`)
        });
        document.write('------------------');
        array.forEach((item, i) => {
            document.write(`<h3>${item}</h3>`);
        })
    </script>
</head>

</body>
</html>
