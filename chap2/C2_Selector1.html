<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>셀렉터 사용하기</title>
<style>
    .circle {
        width: 100px; height: 100px;
        border-radius: 50%;
        background-color: lightgreen;
    }
    #box {
        width: 100px; height: 100px;
        background-color: lightcoral;
    }
</style>
</head>
<body>
    <div class="circle"></div>
    <div id="box"></div>
    <div class="circle"></div>
</body>
</html>
